<!DOCTYPE html>
<html lang="pt-br" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>&lt;/dev&gt; Otávio Cruz</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Estilos -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="grid-bg">

  <!-- ===== NAVEGAÇÃO ===== -->
  <nav>
    <div class="nav-logo">&lt;<span>/</span>dev&gt; Otávio Cruz</div>
    <div class="nav-links" id="navLinks">
      <a href="#home"     data-page="home"     class="active">Home</a>
      <a href="#projects" data-page="projects">Projetos</a>
      <a href="#about"    data-page="about">About</a>
      <a href="#academic" data-page="academic">Acadêmico</a>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- ===== CONTAINER DE PÁGINAS ===== -->
  <!-- O conteúdo de cada página é carregado via fetch() em js/app.js -->
  <main id="page-container">
    <div class="page-loading">Carregando</div>
  </main>

  <!-- Router & interações globais -->
  <script src="js/app.js"></script>

  <!-- Delegação de cliques para links de navegação interna -->
  <script>
    document.addEventListener('click', function (e) {
      const link = e.target.closest('[data-nav]');
      if (!link) return;
      e.preventDefault();
      navigate(link.dataset.nav);
    });

    document.addEventListener('click', function (e) {
      const navLink = e.target.closest('.nav-links a[data-page]');
      if (!navLink) return;
      e.preventDefault();
      navigate(navLink.dataset.page);
    });
  </script>

</body>
</html>
